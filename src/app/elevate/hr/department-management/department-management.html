<div class="min-h-screen bg-[#F7F8FA]">
    <div class="w-full px-[30px] py-[35px]">
        <a href="/set-kpi" class=" w-[170px] text-[#807777] font-medium mb-[20px] flex items-center gap-[15px] link-select hover:text-[#5BA2F7]">
            &larr; Dashboard
            </a>

        <!-- PAGE HEADER -->
        <div class="flex justify-between items-center mb-[28px]">
            <div class="flex flex-col gap-[6px]">
                <span class="text-[28px] font-medium text-[#111827]">
                    Departments
                </span>
                <span class="text-[15px] text-gray-400">
                    All departments, managers and staff in the active cycle
                </span>
            </div>


    <div class="flex items-center gap-[15px]">
    
    <!-- Search -->
    <div class="relative w-[342px]">
        <i class="fa-solid fa-magnifying-glass absolute left-[16px] top-1/2 -translate-y-1/2 text-[18px] text-[#777]"></i>

        <input
        type="text"
        placeholder="Search department..."
        class="w-full h-[50px] rounded-[10px] border border-[#D0D0D0] bg-[#F9FAFB] pl-[48px] pr-[16px] text-[16px] text-[#555] outline-none focus:border-[#999]"
        />
    </div>

    <!-- Filter -->
    <button type="button" class="flex h-[50px] w-[50px] items-center justify-center rounded-[10px] border border-[#D0D0D0] bg-[#F9FAFB] text-[#555] hover:bg-[#F0F1F2]"
    >
        <i class="fa-solid fa-sliders text-[18px]"></i>
    </button>

    </div>
        </div>

                                 24 team members

                    </div>
