<div class="flex items-center justify-center w-full">

  <!-- TARGET PREVIEW -->
  <div
    class="flex items-center gap-2 text-base md:text-sm whitespace-nowrap"
    [class.bg-red-500]="currentStep >= 1"
    [class.bg-gray-400]="currentStep < 1"
    [class.text-white]="currentStep >= 1"
    [class.text-gray-400]="currentStep < 1">
    

    <span
      class="w-6 h-6 md:w-5 md:h-5 rounded-full flex items-center justify-center text-xs md:text-[10px]"
      [class.bg-blue-500]="currentStep >= 1"
      [class.text-white]="currentStep >= 1"
      [class.border-gray-200]="currentStep < 1"
      [class.border]="currentStep < 1">
      1
    </span>

    <span>Target Preview</span>
  </div>


  <!-- LINE -->
  <div
    class="w-14 sm:w-20 md:w-40 h-px mx-3"
    [class.bg-blue-500]="currentStep >= 2"
    [class.bg-gray-200]="currentStep < 2">
  </div>


  <!-- SELF REVIEW -->
  <div
    class="flex items-center gap-2 text-base md:text-sm whitespace-nowrap"
    [class.text-gray-900]="currentStep >= 2"
    [class.text-gray-400]="currentStep < 2">

    <span
      class="w-6 h-6 md:w-5 md:h-5 rounded-full flex items-center justify-center text-xs md:text-[10px]"
      [class.bg-blue-500]="currentStep >= 2"
      [class.text-white]="currentStep >= 2"
      [class.border]="currentStep < 2"
      [class.border-gray-200]="currentStep < 2">
      2
    </span>

    <span>Self-Review</span>
  </div>


  <!-- LINE -->
  <div
    class="w-14 sm:w-20 md:w-40 h-px mx-3"
    [class.bg-blue-500]="currentStep >= 3"
    [class.bg-gray-200]="currentStep < 3">
  </div>


  <!-- MANAGER REVIEW -->
  <div
    class="flex items-center gap-2 text-base md:text-sm whitespace-nowrap"
    [class.text-gray-900]="currentStep >= 3"
    [class.text-gray-400]="currentStep < 3">

    <span
      class="w-6 h-6 md:w-5 md:h-5 rounded-full flex items-center justify-center text-xs md:text-[10px]"
      [class.bg-blue-500]="currentStep >= 3"
      [class.text-white]="currentStep >= 3"
      [class.border]="currentStep < 3"
      [class.border-gray-200]="currentStep < 3">
      3
    </span>

    <span>Manager Review</span>
  </div>

</div>
