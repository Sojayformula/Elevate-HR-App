<nz-steps
  [nzCurrent]="currentStep()"
  nzProgressDot
>
  <nz-step
    nzTitle="Account"
    nzDescription="Create your account"
  />

  <nz-step
    nzTitle="Address"
    nzDescription="Enter your address"
  />

  <nz-step
    nzTitle="Payment"
    nzDescription="Choose payment method"
  />

  <nz-step
    nzTitle="Complete"
    nzDescription="Order completed"
  />
</nz-steps>

<div class="step-content">

  @if (currentStep() === 0) {
    <h2>Account</h2>
    <p>Create your account.</p>
  }

  @if (currentStep() === 1) {
    <h2>Address</h2>
    <p>Enter your delivery address.</p>
  }

  @if (currentStep() === 2) {
    <h2>Payment</h2>
    <p>Choose your payment method.</p>
  }

  @if (currentStep() === 3) {
    <h2>Complete</h2>
    <p>Your order has been completed.</p>
  }

</div>

<div class="actions">

  <button
    nz-button
    [disabled]="currentStep() === 0"
    (click)="previous()"
  >
    Previous
  </button>

  <button
    nz-button
    nzType="primary"
    [disabled]="currentStep() === 3"
    (click)="next()"
  >
    Next
  </button>

</div>
